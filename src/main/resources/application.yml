spring:
  application:
    name: backend-leads
  jmx:
    enabled: false

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${USER_NAME}
    password: ${PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

hmac:
  secret: "${HMAC_SECRET}"