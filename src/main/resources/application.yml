spring:
  application:
    name: backend-leads
  jmx:
    enabled: false

  datasource:
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}
    username: ${USER_NAME}
    password: ${PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.hostinger.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
        transport:
          protocol: smtp

app:
  mail:
    from: no-reply@lucasfncode.com.br
    notify-to: dev@lucasfncode.com.br

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
