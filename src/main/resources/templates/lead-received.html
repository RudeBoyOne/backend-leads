<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Novo Lead Recebido</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { background: #fff; max-width: 500px; margin: 40px auto; border-radius: 8px; box-shadow: 0 2px 8px #ccc; padding: 24px; }
    h2 { color: #2d7cff; margin-top: 0; }
    .info { margin: 16px 0; }
    .label { font-weight: bold; color: #555; }
    .value { color: #222; }
    .footer { margin-top: 32px; font-size: 12px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Novo Lead Recebido</h2>
    <div class="info">
      <span class="label">Data:</span>
      <span class="value">{{date}}</span>
    </div>
    <div class="info">
      <span class="label">Origem:</span>
      <span class="value">{{origin}}</span>
    </div>
    <div class="info">
      <span class="label">ID do Lead na Origem:</span>
      <span class="value">{{originLeadId}}</span>
    </div>
    <div class="footer">
      Este é um e-mail automático. Não responda.
    </div>
  </div>
</body>
</html>
