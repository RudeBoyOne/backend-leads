services:
  postgres:
    image: postgres:16.10
    container_name: postgres-backend-leads
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-internal

  app:
    build: .
    container_name: backend-leads
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-localhost}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-9001}
      MQTT_SERVER_PATH: ${MQTT_SERVER_PATH:-/mqtt}
      MQTT_TOPIC: ${MQTT_TOPIC:-100esperanca/metrics/#}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-backend-leads}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_QOS: ${MQTT_QOS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal
      - lead-network

volumes:
  pgdata:

networks:
  backend-internal:
    driver: bridge
  lead-network:
    external: true
    name: lead-network
